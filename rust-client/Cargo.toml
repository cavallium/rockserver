[package]
name = "rockserver-client"
version = "0.1.0"
edition = "2021"
description = "Async Rust client for RockServer"
license = "MIT"
repository = "https://github.com/cavallium/rockserver"

[workspace]
members = ["rust-data-generator", "examples-runner"]

# Workspace profiles apply to every member; Cargo ignores profiles in member manifests.
[profile.test]
debug = 0
incremental = true
strip = "debuginfo"
opt-level = 0

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "time"] }
futures = "0.3"
bytes = "1.0"
async-stream = "0.3"

[dev-dependencies]

[build-dependencies]
tonic-build = "0.12"
