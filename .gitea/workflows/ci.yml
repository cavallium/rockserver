# Continuous integration on the Gitea instance that hosts the repository (Gitea Actions, GitHub Actions syntax).
#
# Every push and pull request: the core module's tests and the distributed module's fast tests (unit, component and
# in-process cluster tests). Every night, and on demand: the whole distributed suite, multi-process scenarios
# included, on a real disk. See docs/distributed/design.md, "Continuous integration", for what each job covers and
# what the runner needs.
name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

env:
  MAVEN_ARGS: -B -ntp
  # Test directories on the runner's disk, not on a tmpfs /tmp: fsync must cost what it costs (design.md, "Tests").
  TEST_TMPDIR: ${{ github.workspace }}/../rockserver-test-tmp
  # Multi-process suites: one class per line, also the list the fast job excludes. HungDiskTest is listed but runs only
  # with -Drockserver.test.hungDisk=true until its first passing run (design.md, its row in the tests table).
  PROCESS_SUITES: >-
    ClientFailoverTest,ClockSkewRandomFaultTest,ColdRestartTest,DiskFaultTest,ForwardingFailoverTest,HungDiskTest,
    IsolatedNodeTest,LaggingInstallTest,LeaderKillTest,MembershipFaultTest,MembershipTest,OverlappingRandomFaultTest,
    PartitionTest,PauseTest,PipelinedLeaderKillTest,PipelinedPartitionTest,PipelinedRandomFaultTest,ProcessClusterTest,
    ProtocolPointKillTest,PublicApiRecoveryTest,RaftLogRepairTest,RandomFaultTest,RollingRestartTest

jobs:
  fast:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # JDK 27 and Maven: the build compiles with --release 27.
    container: maven:3.9-eclipse-temurin-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-
      - name: gcc for the fault-injecting storage shim (FaultFsTest, DiskFaultTest)
        run: apt-get update && apt-get install -y --no-install-recommends gcc libc6-dev
      - name: Core tests
        run: mvn $MAVEN_ARGS test
      - name: Distributed fast tests
        run: |
          mkdir -p "$TEST_TMPDIR"
          excluded=$(echo "$PROCESS_SUITES" | tr -d ' \n' | sed 's/\([^,]*\)/!\1/g')
          mvn $MAVEN_ARGS -f distributed/pom.xml -pl server -am test \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dtest="it.cavallium.rockserver.distributed.**,$excluded" \
            -Drockserver.test.tmpdir="$TEST_TMPDIR" \
            -Drockserver.test.requireFaultFs=true
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: fast-surefire-reports
          path: "**/target/surefire-reports/"

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: maven:3.9-eclipse-temurin-27
    # The full suite takes about 20 minutes on a desktop; the process scenarios added in round 3 take longer.
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        pipelined: ["false", "true"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: m2-
      - name: gcc for the fault-injecting storage shim (FaultFsTest, DiskFaultTest)
        run: apt-get update && apt-get install -y --no-install-recommends gcc libc6-dev
      - name: Whole distributed suite, multi-process scenarios included
        run: |
          mkdir -p "$TEST_TMPDIR"
          mvn $MAVEN_ARGS -f distributed/pom.xml -pl server -am test \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dtest='it.cavallium.rockserver.distributed.**' \
            -Drockserver.test.tmpdir="$TEST_TMPDIR" \
            -Djunit.jupiter.tempdir.cleanup.mode.default=ON_SUCCESS \
            -Drockserver.test.pipelinedUpdates=${{ matrix.pipelined }} \
            -Drockserver.test.requireFaultFs=true
      # JUnit deletes a test's @TempDir (where the process suites keep each node's stdout.log and stderr.log) only
      # when the test passed (ON_SUCCESS above), so the logs of a failed scenario are still there to upload.
      - name: Test reports and node logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: nightly-reports-pipelined-${{ matrix.pipelined }}
          path: |
            **/target/surefire-reports/
            ${{ env.TEST_TMPDIR }}/**/*.log
