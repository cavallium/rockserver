syntax = "proto3";
package rockserver.cdc;
option java_package = "it.cavallium.rockserver.core.common.api.cdc.proto";
option java_multiple_files = true;
import "rocksdb.proto";

message CdcPosition { int64 term = 1; int64 index = 2; }
message CdcCursor { CdcPosition position = 1; sint32 mutation_ordinal = 2; }
message CdcLineage { bytes range_id = 1; bytes group_id = 2; int64 range_epoch = 3; }
message CdcCheckpointEntry { CdcLineage lineage = 1; CdcCursor cursor = 2; }
message CdcCheckpoint { repeated CdcCheckpointEntry entries = 1; }
message CdcOperationId { bytes session_id = 1; int64 epoch = 2; int64 sequence = 3; }
message CdcDefinition {
  bytes cluster_id = 1; bytes database_id = 2; bytes domain_id = 3;
  bytes subscription_id = 4; bytes incarnation_id = 5;
  bytes directory_digest = 6; repeated bytes columns = 7; CdcCheckpoint start = 8;
}
enum CdcStatePhase { SUBSCRIPTION_ACTIVE = 0; SUBSCRIPTION_CLOSED = 1; }
message CdcState { CdcDefinition definition = 1; CdcStatePhase phase = 2; int64 generation = 3; CdcCheckpoint checkpoint = 4; CdcCheckpoint delivered = 5; CdcCheckpoint current_starts = 6; optional bytes latest_handoff = 7; }
enum CdcLocalPhase { CREATE = 0; ACTIVE = 1; CLOSING = 2; CLOSED = 3; CONFLICT = 4; }
message CdcStatus { CdcState state = 1; CdcLocalPhase phase = 2; }
enum CdcMutationKind { MUTATION_PUT = 0; MUTATION_DELETE = 1; MUTATION_MERGE = 2; MUTATION_DELETE_RANGE = 3; MUTATION_BUCKET_PUT = 4; MUTATION_BUCKET_DELETE = 5; MUTATION_BUCKET_MERGE = 6; }
enum CdcReturnMode { RETURN_NONE = 0; RETURN_PREVIOUS = 1; RETURN_CURRENT = 2; }
message CdcMutation { CdcMutationKind kind = 1; bytes column_id = 2; bytes key = 3; optional bytes value = 4; CdcReturnMode return_mode = 5; repeated bytes member_keys = 6; }
message CdcEvent { int32 mutation_ordinal = 1; CdcMutation mutation = 2; }
enum CdcDecisionPhase { DECISION_COMMIT = 0; DECISION_ABORT = 1; }
message CdcParticipant { CdcLineage lineage = 1; bytes schema_digest = 2; bytes plan_digest = 3; CdcPosition prepared = 4; }
message CdcDecision {
  bytes cluster_id = 1; bytes database_id = 2; bytes domain_id = 3; bytes transaction_id = 4;
  CdcOperationId operation = 5; int64 schema_epoch = 6; bytes schema_digest = 7; bytes plan_digest = 8;
  CdcDecisionPhase phase = 9; repeated CdcParticipant participants = 10;
}
message CdcFinalization { bytes home_group = 1; int64 home_epoch = 2; bytes participant_group = 3; CdcOperationId recovery_operation = 4; CdcDecision decision = 5; }
message CdcEnvelope { CdcPosition position = 1; bytes schema_digest = 2; CdcOperationId operation = 3; CdcFinalization transaction = 4; repeated CdcEvent events = 5; optional bytes terminal_barrier = 6; }
message CdcBatch { bytes id = 1; CdcDefinition definition = 2; CdcLineage lineage = 3; CdcCursor from = 4; CdcCursor next = 5; CdcPosition cut = 6; repeated CdcEnvelope envelopes = 7; CdcCheckpoint current_starts = 8; }
enum CdcOutcome { DATA = 0; GAP = 1; TOO_LARGE = 2; }
message CdcPoll { CdcLineage lineage = 1; CdcOutcome outcome = 2; CdcBatch batch = 3; int32 required_bytes = 4; CdcCursor floor = 5; CdcPosition cut = 6; }
enum CdcTopology { RANGE_ACTIVE = 0; RANGE_FENCED = 1; RANGE_RETIRED = 2; }
message CdcRange { CdcLineage lineage = 1; int64 configuration_version = 2; CdcTopology topology = 3; optional bytes lower_inclusive = 4; optional bytes upper_exclusive = 5; }
// Canonical directory includes placement/replicas; typed metadata exposes CDC definition inputs.
message CdcDirectory {
  bytes canonical = 1; bytes cluster_id = 2; bytes database_id = 3; bytes domain_id = 4;
  int64 schema_epoch = 5; bytes schema_digest = 6; int64 generation = 7;
  repeated bytes columns = 8; int32 routing_prefix_bytes = 9; repeated CdcRange ranges = 10;
}
message CdcContextRequest { bytes domain_id = 1; it.cavallium.rockserver.core.common.api.proto.RequestContext context = 2; }
message CdcCreateRequest { CdcDefinition definition = 1; it.cavallium.rockserver.core.common.api.proto.RequestContext context = 2; }
message CdcSubscriptionRequest { bytes subscription_id = 1; it.cavallium.rockserver.core.common.api.proto.RequestContext context = 2; }
message CdcPollRequest { bytes subscription_id = 1; int32 max_records = 2; int32 max_bytes = 3; it.cavallium.rockserver.core.common.api.proto.RequestContext context = 4; }
message CdcAcknowledgeRequest { bytes subscription_id = 1; bytes batch_id = 2; it.cavallium.rockserver.core.common.api.proto.RequestContext context = 3; }
service DistributedCdcService {
  rpc Context(CdcContextRequest) returns (CdcDirectory);
  rpc Create(CdcCreateRequest) returns (CdcStatus);
  rpc Recover(CdcSubscriptionRequest) returns (CdcStatus);
  rpc Status(CdcSubscriptionRequest) returns (CdcStatus);
  rpc Poll(CdcPollRequest) returns (CdcPoll);
  rpc Acknowledge(CdcAcknowledgeRequest) returns (CdcStatus);
  rpc CloseSubscription(CdcSubscriptionRequest) returns (CdcStatus);
}
